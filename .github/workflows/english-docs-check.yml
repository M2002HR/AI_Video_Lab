name: English-only docs audit

# Manual-only by design. Routine pushes and pull requests must not generate
# notification noise for this repository-language audit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository text is English-only
        run: python 11_TOOLS/check_english_docs.py
