name: Apply English documentation migration

on:
  push:
    paths:
      - '.migration/english_docs_ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and extract translated documentation
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/english_docs_payload_v2.part* > /tmp/docs_payload.b64
          base64 --decode /tmp/docs_payload.b64 > /tmp/docs_payload.tar.gz
          gzip -t /tmp/docs_payload.tar.gz
          tar -xzf /tmp/docs_payload.tar.gz -C .
      - name: Sanitize residual legacy non-English prose
        run: python 11_TOOLS/sanitize_legacy_non_english.py
      - name: Verify English-only repository text
        run: python 11_TOOLS/check_english_docs.py
      - name: Remove migration payload and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .migration/english_docs_payload.part* .migration/english_docs_payload_v2.part* .migration/english_docs_ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate repository documentation to English only'
          git push
